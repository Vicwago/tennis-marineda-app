<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#060d1a" />
    <meta name="description" content="Gestión de rankings de Pádel y Tenis — Escuela de Tenis Marineda" />
    <meta name="application-name" content="Marineda" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marineda" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />

    <!-- Favicon + Manifest -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />

    <!-- Previsualización al compartir el enlace (WhatsApp, Instagram, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Escuela de Tenis Marineda" />
    <meta property="og:title" content="Liga de la Escuela de Tenis Marineda" />
    <meta property="og:description" content="Crea tu cuenta en un minuto, marca tus horas y mira tu partido de cada semana: rival, día, hora y pista." />
    <meta property="og:image" content="https://tennis-padel-app-sigma.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tennis-padel-app-sigma.vercel.app/unirse" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Captura el aviso de instalación de Chrome/Android para ofrecer el botón "Instalar" en /unirse -->
    <script>window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__pwaInstallPrompt = e; });</script>

    <!-- Anti-cache meta tags -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Escuela de Tenis Marineda</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Limpiar Service Workers, caches obsoletos, y auto-actualizar si hay versión nueva -->
    <script>
      // 1. Limpiar SW
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      // 2. Limpiar caches API
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
      // 3. Auto-actualizar: comprobar si el HTML cargado es el más reciente
      (function() {
        var BUILD_VERSION = 'v2026-10-06-1';
        var vKey = 'app_version';
        var stored = localStorage.getItem(vKey);
        if (stored && stored !== BUILD_VERSION) {
          localStorage.setItem(vKey, BUILD_VERSION);
          // Forzar recarga saltándose caché del navegador. Se conserva el #hash: el enlace de
          // "recuperar contraseña" trae el token ahí y antes se perdía en esta recarga.
          location.href = location.pathname + '?_=' + Date.now() + location.hash;
          return;
        }
        localStorage.setItem(vKey, BUILD_VERSION);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
